name: gg_multi_core
description: "Workspace model of the gg_multi tool family - the ocean/tickets/trash layout, organization folders, url parsing, git platforms, ticket metadata and state."
version: 4.18.0
repository: https://github.com/ggsuite/gg_multi_core.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  gg_args: ^3.2.0
  gg_console_colors: ^2.5.0
  gg_git: ^4.8.1
  gg_lang: ^0.8.4
  gg_local_package_dependencies: ^4.2.4
  gg_localize_refs: ^5.2.1
  gg_log: ^1.2.0
  gg_one: ^14.4.13
  gg_one_core: ^2.16.1
  gg_publish: ^4.10.3
  http: ^1.6.0
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.1
  pubspec_parse: ^1.7.0
  yaml: ^3.1.4

dev_dependencies:
  dna_ggsuite: ^1.0.2
  gg_capture_print: ^1.2.1
  gg_process: ^1.4.1
  gg_status_printer: ^1.6.4
  helix: ^1.14.0
  lints: ^6.1.0
  test: ^1.33.0