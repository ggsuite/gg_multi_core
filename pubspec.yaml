name: gg_multi_core
description: "Workspace model of the gg_multi tool family - the ocean/tickets/trash layout, organization folders, url parsing, git platforms, ticket metadata and state."
version: 2.0.0
repository: https://github.com/ggsuite/gg_multi_core.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  gg_console_colors: ^2.3.0
  gg_git: ^4.0.0
  gg_local_package_dependencies: ^3.0.0
  gg_log: ^1.0.6
  gg_one: ^13.1.0
  http: ^1.6.0
  interact: ^2.2.0
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.0
  pubspec_parse: ^1.5.0

dev_dependencies:
  gg_capture_print: ^1.0.9
  gg_status_printer: ^1.4.2
  lints: ^6.1.0
  test: ^1.31.2